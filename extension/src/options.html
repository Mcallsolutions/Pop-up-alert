<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opcoes - Mcall Ticket Tag Monitor</title>
    <link rel="stylesheet" href="popup.css" />
    <style>
      body {
        min-width: 0;
      }
      .popup {
        max-width: 620px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <main class="popup">
      <header>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"></path>
              <circle cx="7.5" cy="7.5" r=".5" fill="currentColor"></circle>
            </svg>
          </span>
          <div>
            <h1>Mcall Ticket Tag Monitor</h1>
            <p class="eyebrow">Configuracoes da extensao</p>
          </div>
        </div>
      </header>

      <form id="optionsForm" class="config">
        <label>
          URL da API
          <input id="apiBaseUrl" name="apiBaseUrl" type="url" placeholder="https://tag-monitor.mcallsolutions.com.br" />
        </label>
        <label>
          Seu token de acesso
          <input id="apiToken" name="apiToken" type="password" placeholder="mca_..." autocomplete="off" />
          <small>
            Emitido no painel (Configuracoes) ou por <code>npm run token</code>. E ele que define de quem sao os
            alertas: cada atendente cola o seu. Tickets sem atendente aparecem para todos.
          </small>
        </label>
        <label class="check">
          <input id="inactivitySound" name="inactivitySound" type="checkbox" />
          Bip quando um cliente com atendente passar do limite de inatividade
          <small>
            Dois toques curtos, uma vez por cliente, enquanto a tela de tickets do MTalk estiver aberta. Toca mesmo com a
            aba em segundo plano e sem precisar clicar na pagina.
          </small>
        </label>
        <button id="testBeep" type="button" class="secondary">Testar bip</button>
        <button type="submit" class="primary">Salvar configuracao</button>
      </form>

      <p id="feedback" class="feedback" role="status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
