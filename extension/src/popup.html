<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mcall Ticket Tag Monitor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header>
        <div>
          <p class="eyebrow">Mcall</p>
          <h1>Ticket Tag Monitor</h1>
        </div>
        <span id="apiBadge" class="badge badge-muted">API</span>
      </header>

      <section class="metrics" aria-label="Ultima coleta">
        <div>
          <span>Tickets</span>
          <strong id="totalTickets">0</strong>
        </div>
        <div>
          <span>Sem TAG</span>
          <strong id="missingTags">0</strong>
        </div>
        <div>
          <span>Inativos</span>
          <strong id="inactiveTickets">0</strong>
        </div>
        <div>
          <span>Aguardando</span>
          <strong id="waitingTickets">0</strong>
        </div>
      </section>

      <dl class="status-list">
        <div>
          <dt>Ultima coleta</dt>
          <dd id="collectedAt">-</dd>
        </div>
        <div>
          <dt>Ultima consulta</dt>
          <dd id="lastFetchAt">-</dd>
        </div>
        <div>
          <dt>Situacao</dt>
          <dd id="situation">-</dd>
        </div>
        <div>
          <dt>Alertas de</dt>
          <dd id="scope">-</dd>
        </div>
        <div id="errorRow" hidden>
          <dt>Erro</dt>
          <dd id="lastError">-</dd>
        </div>
      </dl>

      <div class="actions">
        <button id="forceCollect" type="button">Coletar agora</button>
        <button id="checkApi" type="button" class="secondary">Testar API</button>
      </div>

      <form id="configForm" class="config">
        <label>
          URL da API
          <input id="apiBaseUrl" name="apiBaseUrl" type="url" placeholder="https://tag-monitor.mcallsolutions.com.br" />
        </label>
        <label>
          Seu token de acesso
          <input id="apiToken" name="apiToken" type="password" placeholder="mca_..." autocomplete="off" />
        </label>
        <button type="submit">Salvar configuracao</button>
      </form>

      <p id="feedback" class="feedback" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
