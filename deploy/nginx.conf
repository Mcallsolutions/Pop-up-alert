# nginx do painel. Copie para /etc/nginx/sites-available/mcall, crie o link em
# sites-enabled e rode `sudo certbot --nginx -d xn--gesto-dra.mcallsolutions.com.br`:
# o certbot preenche sozinho o bloco 443 e o redirect do 80.
#
# O dominio vai em ASCII (punycode). gestao.mcallsolutions.com.br fica como
# alias sem acento — util para quem digita a URL e para o certificado.

server {
    listen 80;
    listen [::]:80;
    server_name xn--gesto-dra.mcallsolutions.com.br gestao.mcallsolutions.com.br;

    # Painel compilado (npm run build). Servido pelo nginx; a API responde
    # apenas /api e /health. Com SERVE_ADMIN=1 o Node tambem serviria o painel,
    # mas deixar com o nginx e mais barato.
    root /opt/mcall/dist;
    index index.html;

    # O painel navega por estado, nao por URL: basta devolver o index.
    location / {
        try_files $uri /index.html;
    }

    # /health entra aqui porque a extensao usa ele no botao "Testar API".
    location ~ ^/(api|health) {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # O .zip da extensao e gerado na hora e nao deve ficar em cache.
    location = /api/extension/download {
        proxy_pass http://127.0.0.1:3333;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }

    client_max_body_size 2m;
}
